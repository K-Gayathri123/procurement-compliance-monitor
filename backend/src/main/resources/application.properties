spring.application.name=procurement-backend
server.port=8080

# Existing writable database file.
spring.datasource.url=jdbc:sqlite:${DATABASE_PATH:./data/procurement_backend.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# Conservative configuration for the local SQLite demo.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# Never recreate or update the existing schema automatically.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Security implementation will be added in Cell 2.
# No secret is written into the project.
app.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.jwt.issuer=procurement-monitor
app.jwt.ttl-seconds=1800

# First-run admin activation only.
app.bootstrap.password=${BOOTSTRAP_PASSWORD:}

# Local source-file storage for the MVP.
app.upload-directory=${UPLOAD_DIRECTORY:./data/uploads}

logging.level.com.procurement.monitor=INFO

# Cell 4: exact-date direct exchange-rate matching.
# Blank source requires exactly one matching rate.
app.compliance.rate-source=${COMPLIANCE_RATE_SOURCE:}
app.purchase.max-csv-rows=5000
